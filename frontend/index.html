<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disposición de áreas</title>
  </head>
  <body>
    <header class="barra-superior">
      <div class="barra-superior__zona">
        <span class="barra-superior__titulo">Disposición de áreas</span>
        <!-- Configuraciones de áreas: las rellena `disposiciones.js`. -->
        <div class="barra-superior__disposiciones" id="disposiciones"></div>
      </div>
      <div class="barra-superior__acciones">
        <button class="boton-barra" id="boton-restablecer" type="button">
          Restablecer disposición
        </button>

        <!-- Botón de tema. Enseña el tema AL QUE SE PASA, así que en oscuro
             muestra el sol. El icono lo elige el CSS a partir de `data-tema` y
             el texto de ayuda lo pone `principal.js`. -->
        <button
          class="boton-icono"
          id="boton-tema"
          type="button"
          aria-pressed="true"
          aria-label="Cambiar a tema claro"
          title="Cambiar a tema claro"
        >
          <svg
            class="boton-icono__dibujo boton-icono__sol"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2 12h2M20 12h2M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"
            />
          </svg>
          <svg
            class="boton-icono__dibujo boton-icono__luna"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- El envoltorio es la referencia de posición de la disposición y de las
         capas superpuestas: la de los cruces y la del gesto de dividir y
         fundir áreas. -->
    <div class="disposicion-envoltorio" id="envoltorio">
      <div class="disposicion" id="disposicion"></div>
      <div class="capa-esquinas" id="capa-esquinas"></div>
      <div class="capa-esquinas" id="capa-areas"></div>
    </div>

    <script type="module" src="/src/principal.js"></script>
  </body>
</html>
